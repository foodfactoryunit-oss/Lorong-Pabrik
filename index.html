/* ===== AUDIO (Web Audio API, tanpa file) ===== */
let AC,mg,bg,sg,NB,muted=false,tmr,step=0,nextT=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const BASS=[110,87.31,130.81,98],CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
function au(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.connect(AC.destination);
    bg=AC.createGain();bg.gain.value=muted?0:.22;bg.connect(mg);
    sg=AC.createGain();sg.gain.value=.35;sg.connect(mg);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==="suspended")AC.resume();
}
function tn(f,t,d,ty,v,to,dst){
  dst=dst||sg;const o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.02);
}
function nz(t,d,v,fq){
  const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=fq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(bg);s.start(t);s.stop(t+d);
}
function sched(){
  const sp=60/112/4;
  while(nextT<AC.currentTime+.25){
    const s=step%64,b=s>>4,k=s&15,t=nextT;
    if(k%4===0)tn(160,t,.16,"sine",1,42,bg);
    if(k===4||k===12)nz(t,.12,.5,1500);
    if(k%2===1)nz(t,.04,.18,7000);
    if(k%4===0||k===6||k===10)tn(BASS[b],t,sp*2.6,"triangle",.8,0,bg);
    if(k%2===0)tn(mf(CH[b][(k>>1)%3]+12),t,sp*1.6,"square",.12,0,bg);
    if(k===0||k===8)tn(mf(CH[b][0]+24),t,sp*7,"sine",.1,0,bg);
    step++;nextT+=sp;
  }
}
function music(){au();if(tmr)return;nextT=AC.currentTime+.1;tmr=setInterval(sched,50)}
function P(a,gap,ty,d,v){au();const t=AC.currentTime;a.forEach((f,j)=>tn(f,t+j*gap,d,ty,v))}
const sfx={
  clk:()=>P([520],0,"square",.06,.18),
  ok:()=>P([523,659,784,1047],.07,"triangle",.18,.5),
  no:()=>{au();const t=AC.currentTime;tn(220,t,.3,"sawtooth",.3,90);tn(165,t+.15,.35,"sawtooth",.3,70)},
  hint:()=>P([880,1175],.09,"sine",.15,.4),
  combo:()=>P([659,784,988,1319,1568],.05,"square",.12,.3),
  badge:()=>P([392,523,659,784,1047],.1,"triangle",.3,.5),
  go:()=>P([262,330,392,523,659,784],.06,"square",.12,.25),
  win:()=>P([523,659,784,1047,1319],.12,"triangle",.4,.5),
  lose:()=>P([392,330,262],.18,"sine",.4,.4)
};
document.addEventListener("visibilitychange",()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
const muteBtn=()=>`<button class="mute" aria-pressed="${muted}">${muted?"🔇 Musik mati":"🔊 Musik nyala"}</button>`;
function bindMute(){
  document.querySelectorAll(".mute").forEach(b=>b.onclick=()=>{
    muted=!muted;au();bg.gain.setTargetAtTime(muted?0:.22,AC.currentTime,.05);
    document.querySelectorAll(".mute").forEach(x=>{x.textContent=muted?"🔇 Musik mati":"🔊 Musik nyala";x.setAttribute("aria-pressed",muted)});
  });
}

function upd(dt){
  G.px+=(G.tl-G.px)*Math.min(1,dt*12);G.rt=(G.rt||0)+dt;

const K=()=>Math.min(1.6,Math.max(1,cw/360));

function person(c,x,y,h,t,lean){

  [[-1,sw],[1,-sw]].forEach(([d,s])=>{

  c.fillStyle="#fff";c.fillRect(-16*u,-48*u,32*u,6*u);
  c.fillStyle="#1A1033";c.font=`800 ${9*u}px Poppins,sans-serif`;c.fillText("BFM",0,-62*u);

function draw(){

  c.beginPath();c.moveTo(W,0);c.lineTo(W/2+rh(0),Y(0));c.lineTo(W/2+rh(1),H);c.lineTo(W,H);c.fill();

function pick(c,j){

  const title=sharp>=5?"Lari yang Terarah":sharp>=3?"Lari yang Terengah-engah":"Lari yang Tersandung";
  const story=sharp>=5?"17.30. Kamu sampai di garis akhir dengan napas teratur. Besok pagi semua tim tahu apa yang dikerjakan dan siapa PIC-nya."
    :sharp>=3?"17.30. Kamu sampai di garis akhir, tapi beberapa isu masih menggantung. Besok masih ada yang harus dikejar."
    :"17.30. Beberapa keputusan membuatmu tersandung, tapi kamu tetap sampai di akhir dan membawa jejak untuk dipelajari.";
  const rf=won?`Mantap, ${esc(name)}! Kamu cepat sekaligus tajam. Pertahankan ritme ini.`
    :`Larinya berat, ${esc(name)}, tapi tiap gerbang tadi meninggalkan pelajaran. Coba lagi dan ambil jalur lain. Kamu pasti bisa!`;
  const got=[true,true,sharp>=5,maxS>=3,hints===0,paths.has("2a")&&paths.has("2b"),hits===0];
  won?sfx.win():sfx.lose();
  view(`${topbar()}<div class="card hero"><div class="scene">${won?"🏆":"💪"}</div><h2>${title}</h2><p>${story}</p><p><b>${rf}</b></p></div>
  <div class="card mid"><h3>Hasil kamu</h3><div class="ring" style="background:conic-gradient(#C8FF3D ${acc}%,var(--dot) 0)"><div><b>${sharp}/7</b><small>keputusan tajam</small></div></div>
  <div class="st"><div><b>⭐ ${pts}</b><span>Total poin</span></div><div><b>🔥 x${maxS}</b><span>Combo terbaik</span></div><div><b>🪙 ${coins}</b><span>Koin</span></div><div><b>${hits}</b><span>Tabrakan</span></div><div><b>${hints}</b><span>Hint dipakai</span></div><div><b>${route.startsWith("Jalur A")?"A":"B"}</b><span>Jalur pagi</span></div></div>
  ${mets()}<p class="note">Target: minimal 5 keputusan tajam. ${won?"Tercapai!":"Belum tercapai, tapi kamu sudah dekat."}</p></div>
  <div class="card"><h3>🏅 Lencana</h3><div class="bg">${BADGES.map((b,j)=>`<div class="bd${got[j]?"":" lk"}"><span>${b.e}</span><b>${b.n}</b><small>${got[j]?"Didapat":b.d}</small></div>`).join("")}</div></div>
  <div class="card"><h3>📋 Jejak keputusanmu</h3><p class="note">Tap tiap gerbang untuk melihat konsekuensi dan pembahasannya.</p>${log.map((l,k)=>`<details><summary>${TI[l.ti].e} ${k+1}. ${l.k}</summary><p><b>Pilihanmu:</b> ${l.t}</p><p>${l.r}</p><p><b>Pelajaran:</b> ${l.l}</p>${l.ti<2?`<p><b>Jalur yang lebih tajam:</b> ${l.best}</p>`:""}</details>`).join("")}</div>
  <button class="btn pk" id="again">Lari lagi 🔁</button>`);
  $("#again").onclick=()=>{sfx.go();brief()};
}
gate();
})();
</script>
</body>
</html>
